name: Build iOS16 deps (FFmpeg + JVM runtime)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deps:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for c in Xcode_16.4 Xcode_16.3 Xcode_16.2 Xcode_16.1 Xcode_16.0 Xcode_16; do
            if [ -d "/Applications/$c.app" ]; then sudo xcode-select -s "/Applications/$c.app"; echo "picked $c"; break; fi
          done
          xcodebuild -version

      - name: Tools
        run: |
          set -euxo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen || true
          brew list maven    >/dev/null 2>&1 || brew install maven    || true
          brew list autoconf >/dev/null 2>&1 || brew install autoconf || true
          brew list automake >/dev/null 2>&1 || brew install automake || true
          brew list libtool  >/dev/null 2>&1 || brew install libtool  || true
          echo "JAVA_HOME=$(/usr/libexec/java_home)" >> "$GITHUB_ENV"

      - name: FFmpeg (iOS + tvOS)
        run: |
          set -euxo pipefail
          Scripts/build-apple-ffmpeg.sh

      - name: Java host
        run: |
          set -euxo pipefail
          Scripts/build-java-host.sh

      - name: Apple runtime (JVM + interpreter)
        run: |
          set -euxo pipefail
          mkdir -p build/ScriptHost build/PythonHost
          touch build/ScriptHost/.keep build/PythonHost/.keep
          Scripts/package-apple-runtime.sh ios

      - name: Sync Java host into the runtime
        run: |
          set -euxo pipefail
          Scripts/sync-apple-javahost.sh ios

      - name: Pack deps
        run: |
          set -euxo pipefail
          du -sh build/FFmpeg build/AppleRuntime build/JavaHost || true
          tar -czf deps-ios16.tgz build/FFmpeg build/AppleRuntime build/JavaHost
          ls -lh deps-ios16.tgz

      - name: Publish deps release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG=deps-ios16
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" deps-ios16.tgz \
            --title "iOS16 build deps (FFmpeg + JVM runtime)" \
            --notes "Prebuilt intermediates so iOS builds skip ~27 min of compilation."
          gh release view "$TAG"
