name: Build iOS IPA (iOS 16)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install build tools
        run: |
          brew install xcodegen maven
          npm install -g node || true
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up JDK 19 for Java host
        run: |
          brew install --cask temurin@19 || true
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 19 2>/dev/null || echo /Library/Java/JavaVirtualMachines/temurin-19.jdk/Contents/Home)" >> "$GITHUB_ENV"

      - name: Build FFmpeg
        run: Scripts/build-apple-ffmpeg.sh

      - name: Build Apple runtime (JVM + interpreter) for iOS
        run: Scripts/package-apple-runtime.sh ios

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild -project TVBox.xcodeproj -scheme TVBox-iOS \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build/DerivedData-ios \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package IPA
        run: |
          APP="build/DerivedData-ios/Build/Products/Release-iphoneos/TVBox.app"
          # find the actual app name
          APP=$(find build/DerivedData-ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r "Yingxia-ios16.ipa" Payload
          ls -la Yingxia-ios16.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Yingxia-iOS16-ipa
          path: Yingxia-ios16.ipa
          retention-days: 30
