workflows:
  ios-ipa:
    name: Build iOS 16 IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 16.2
      java: 17
      node: 20
      vars:
        LANG: en_US.UTF-8
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
    cache:
      cache_paths:
        - $CM_BUILD_DIR/build
    scripts:
      - name: Tools
        script: |
          set -euxo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen || true
          brew list maven    >/dev/null 2>&1 || brew install maven    || true
          brew list autoconf >/dev/null 2>&1 || brew install autoconf || true
          brew list automake >/dev/null 2>&1 || brew install automake || true
          brew list libtool  >/dev/null 2>&1 || brew install libtool  || true
          if ! command -v xcodegen >/dev/null; then
            curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            unzip -qo /tmp/xcodegen.zip -d /tmp/xg
            sudo cp /tmp/xg/xcodegen/bin/xcodegen /usr/local/bin/
          fi
          if ! command -v mvn >/dev/null; then
            curl -fsSL -o /tmp/mvn.tar.gz https://dlcdn.apache.org/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz
            mkdir -p "$HOME/maven" && tar -xzf /tmp/mvn.tar.gz -C "$HOME/maven" --strip-components=1
            echo "PATH=$HOME/maven/bin:$PATH" >> "$CM_ENV"
          fi
          xcodebuild -version; xcodegen --version; mvn -v | head -2
      - name: FFmpeg
        script: |
          set -euxo pipefail
          if [ -f build/FFmpeg/FFmpeg.xcframework/Info.plist ]; then
            echo "cached, skip"
          else
            Scripts/build-apple-ffmpeg.sh
          fi
      - name: Java host
        script: |
          set -euxo pipefail
          Scripts/build-java-host.sh
      - name: Mac-only host dirs
        script: |
          set -euxo pipefail
          mkdir -p build/ScriptHost build/PythonHost
          touch build/ScriptHost/.keep build/PythonHost/.keep
      - name: Apple runtime (JVM + interpreter)
        script: |
          set -euxo pipefail
          if [ -f build/AppleRuntime/iphoneos/lib/libTVAppleRuntime.a ]; then
            echo "cached, skip"
          else
            Scripts/package-apple-runtime.sh ios
          fi
      - name: FFmpeg xcframework guard
        script: |
          set -uo pipefail
          {
            echo "pwd=$PWD"
            link="$PWD/Vendor/FFmpeg/FFmpeg.xcframework"
            echo "--- link ---"
            ls -ld "$link" || true
            target=$(realpath "$link" 2>/dev/null || true)
            echo "resolved=$target"
            if [ -z "$target" ] || [ ! -f "$target/Info.plist" ]; then
              echo "rebuilding FFmpeg"
              Scripts/build-apple-ffmpeg.sh || true
              target=$(realpath "$link" 2>/dev/null || true)
              echo "resolved-after=$target"
            fi
            echo "--- xcframeworks found ---"
            find build -maxdepth 3 -name '*.xcframework' -print 2>/dev/null || true
            if [ -n "$target" ] && [ -f "$target/Info.plist" ]; then
              echo "OK: $target"
              ls "$target" || true
            else
              echo "MISSING xcframework"
            fi
          } > ffmpeg-guard.log 2>&1
          cat ffmpeg-guard.log
          exit 0
      - name: Xcode project
        script: |
          set -uo pipefail
          xcodegen generate > xcodegen.log 2>&1
          echo "xcodegen exit=$?"
          tail -30 xcodegen.log || true
          exit 0
      - name: Build iOS app
        script: |
          set -uo pipefail
          rm -f build-swift.log
          xcodebuild -project TVBox.xcodeproj -scheme TVBox-iOS \
            -skipMacroValidation -skipPackagePluginValidation \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-ios \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_ALLOWED=YES build > build-swift.log 2>&1
          echo "xcodebuild exit=$?"
          grep -E "error:|BUILD (FAILED|SUCCEEDED)" build-swift.log | head -60 || true
          exit 0
      - name: Package IPA
        script: |
          set -uo pipefail
          APP=$(find build/DerivedData-ios/Build/Products -name '*.app' -maxdepth 4 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "no app produced"; exit 0; fi
          echo "app: $APP"
          du -sh "$APP" || true
          ls "$APP" | head -20 || true
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>/dev/null || echo "")
          echo "executable: $EXE"
          if [ -n "$EXE" ] && [ ! -f "$APP/$EXE" ]; then echo "ERROR: app binary missing"; exit 0; fi
          rm -rf Payload && mkdir -p Payload
          ditto "$APP" "Payload/$(basename "$APP")"
          find Payload -maxdepth 2 | head -25
          zip -qry Yingxia-ios16.ipa Payload
          ls -lh Yingxia-ios16.ipa
          unzip -l Yingxia-ios16.ipa | tail -5
    artifacts:
      - Yingxia-ios16.ipa
      - build-swift.log
      - ffmpeg-guard.log
      - xcodegen.log
