workflows:
  ios-ipa:
    name: Build iOS 16 IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 16.2
      node: 20
      vars:
        LANG: en_US.UTF-8
        JAVA_HOME: /Users/builder/jdk19/Contents/Home
    scripts:
      - name: Toolchain
        script: |
          set -e
          brew install xcodegen maven autoconf automake libtool pkg-config
          # Temurin 19 (Codemagic ships 8/11/17/21 only; the JVM host build pins 19)
          mkdir -p "$HOME/jdk19"
          curl -fsSL -o /tmp/jdk19.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/19/ga/mac/aarch64/jdk/hotspot/normal/eclipse"
          tar -xzf /tmp/jdk19.tar.gz -C "$HOME/jdk19" --strip-components=1
          ls "$HOME/jdk19/Contents/Home/bin/java"
          echo "JAVA_HOME=$HOME/jdk19/Contents/Home" >> "$CM_ENV"
          export JAVA_HOME="$HOME/jdk19/Contents/Home"
          "$JAVA_HOME/bin/java" -version
          xcodebuild -version
          xcodegen --version
          mvn -v | head -2
      - name: FFmpeg
        script: |
          set -e
          export JAVA_HOME="$HOME/jdk19/Contents/Home"
          Scripts/build-apple-ffmpeg.sh
      - name: Java host
        script: |
          set -e
          export JAVA_HOME="$HOME/jdk19/Contents/Home"
          Scripts/build-java-host.sh
      - name: Mac-only host dirs
        script: |
          set -e
          mkdir -p build/ScriptHost build/PythonHost
          touch build/ScriptHost/.keep build/PythonHost/.keep
      - name: Apple runtime (JVM + interpreter)
        script: |
          set -e
          export JAVA_HOME="$HOME/jdk19/Contents/Home"
          Scripts/package-apple-runtime.sh ios
      - name: Xcode project
        script: |
          set -e
          xcodegen generate
      - name: Build iOS app
        script: |
          set -e
          xcodebuild -project TVBox.xcodeproj -scheme TVBox-iOS \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-ios \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_ALLOWED=YES build
      - name: Package IPA
        script: |
          set -e
          APP=$(find build/DerivedData-ios/Build/Products -name '*.app' -maxdepth 4 | head -1)
          echo "app: $APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Yingxia-ios16.ipa Payload
          ls -lh Yingxia-ios16.ipa
    artifacts:
      - Yingxia-ios16.ipa
